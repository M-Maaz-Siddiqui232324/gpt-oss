<style>
    .chat-container {
        width: 380px;
        background: #fff;
        border: 1px solid #ccc;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        border-radius: 6px;
        font-family: Arial, sans-serif;
    }

    .chat-header {
        background-color: #eff3f7;
        padding: 2% 3%;
        cursor: pointer;
        border-top-left-radius: 6px;
        border-top-right-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #ccc;
    }

    .chat-header-content {
        display: flex;
        align-items: center;
    }

    .chat-header .chat-text {
        margin-left: 10px;
        font-size: 16px;
    }

    .chat-header .fa-times {
        font-size: 16px;
        cursor: pointer;
        padding: 5px;
        font-weight: lighter;
    }

        .chat-header .fa-times:hover {
            color: #333;
        }


    .chat-logo {
        width: 76px;
        height: 50px;
        border-radius: 25px;
        background-color: #3375c6;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        overflow: hidden;
        white-space: nowrap;
        padding: 0 10px;
        position: relative;
    }

        .chat-logo i {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .chat-logo .chat-text {
            margin-left: 10px;
            opacity: 0;
            white-space: nowrap;
            transition: opacity 0.3s ease;
            overflow: hidden;
            max-width: 0;
            font-size: 15px;
        }

        .chat-logo:hover {
            width: auto;
            border-radius: 25px;
            padding: 0 15px;
        }

            .chat-logo:hover .chat-text {
                opacity: 1;
                max-width: 200px; 
            }


    .chat-body {
        max-height: 500px;
        min-height: 500px;
        display: flex;
        flex-direction: column;
        background-color: white;
        overflow-y: auto;
    }

    .chat-body-head{
        padding: 1% 7%;
        text-align: center;
    }

        .chat-body-head p {
            color: #818080;
        }

        .chat-body-head h5 {
            font-size: 16px;
        }

    .chat-messages {
        flex: 1;
        padding: 10px;
    }

    .chat-input {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ccc;
        background-color: #eff3f7;
    }

        .chat-input input {
            flex: 1;
            padding: 6px;
            margin-right: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f9f9f9;
        }

        .chat-input .fa-paper-plane {
            padding: 6px 8px;
            color: #3375c6;
            font-size: 18px;
        }


    .message-wrapper {
        display: flex;
        width: 100%;
        margin-bottom: 10px;
    }
        .message-wrapper.user {
            justify-content: flex-end;
        }

        .message-wrapper.bot {
            justify-content: flex-start;
        }

    .message {
        display: inline-block;
        
        padding: 8px 12px;
        border-radius: 16px;
        /*font-size: 14px;*/
        line-height: 1.4;
        word-wrap: break-word;
        word-break: break-word;
    }

    .message-wrapper.user .message {
        background-color: #3375c6;
        color: white;
        /*border-bottom-right-radius: 0;*/
    }

    .message-wrapper.bot .message {
        background-color: #f9f9f9;
        color: #181818;
        /*border-bottom-left-radius: 0;*/
    }
    .message-bubble {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        max-width: 80%;
    }

    .message-wrapper.bot .message-bubble {
        align-items: flex-start;
    }

    .timestamp {
        font-size: 11px;
        color: #666;
        margin-top: 4px;
    }


    .typing-indicator {
        display: inline-flex;
        align-items: center;
        height: 20px;
    }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            margin: 0 2px;
            background-color: #999;
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.2s infinite ease-in-out;
        }

            .typing-indicator span:nth-child(2) {
                animation-delay: 0.2s;
            }

            .typing-indicator span:nth-child(3) {
                animation-delay: 0.4s;
            }

    @keyframes typing {
        0%, 80%, 100% {
            transform: scale(0.6);
            opacity: 0.3;
        }

        40% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .no-bullets {
        list-style-type: none;
        padding-left: 0;
    }
</style>

                <div class="chat-body-head">
                    <h5>Hi! I am here to help...</h5>
                    <p>I can answer your questions, guide you through features, or connect you with detailed help.</p>
                    <hr/>
                </div>
                <div class="chat-messages">

                    <div ng-repeat="msg in messages" class="message-wrapper" ng-class="msg.sender">
                        <div class="message-bubble" ng-if="!msg.isTyping">

                            <div class="message" ng-bind-html="msg.text"></div>
                            
                        </div>
                            <div class="timestamp">
                                {{ msg.timestamp | date:'hh:mm a' }}
                            </div>
                        </div>

                        <div class="typing-indicator" ng-if="msg.isTyping">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
                <div class="chat-input">
                    <input type="text" ng-model="userInput" ng-keypress="checkEnter($event)" placeholder="Ask me a question..." />
                    <i class="fa fa-paper-plane" ng-click="sendMessage()" aria-hidden="true"></i>
                </div>
            </div>
